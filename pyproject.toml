[project]
name = "embedding-art"
version = "0.1.0"
description = "Generate art by optimizing toward coordinates in multimodal embedding space"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cal"}
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "diffusers>=0.24.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
    "einops>=0.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.2",
    "numba>=0.59.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
]
# LanguageBind itself is NOT on PyPI (research codebase, no setup.py). You
# still need to clone it and put it on PYTHONPATH (see README.md). But these
# are LanguageBind's transitive Python dependencies that ARE on PyPI and
# weren't being pinned anywhere — fresh installs would discover them one at
# a time via opaque ImportError chains. Install with:
#   pip install -e ".[languagebind]"        # Linux / Windows
#   pip install -e ".[languagebind-macos]"  # Apple Silicon (uses eva-decord
#                                           #   instead of decord, since
#                                           #   upstream decord has no
#                                           #   prebuilt arm64 wheels)
languagebind = [
    "peft>=0.7.0",
    "decord>=0.6.0",
    "ftfy>=6.1.0",
    "iopath>=0.1.10",
    "webdataset>=0.2.0",
]
languagebind-macos = [
    "peft>=0.7.0",
    "eva-decord>=0.6.1",
    "ftfy>=6.1.0",
    "iopath>=0.1.10",
    "webdataset>=0.2.0",
]

[project.scripts]
embed-art = "embedding_art.cli.main:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # slow tests require real model weights (gated HF downloads, multi-GB
    # checkpoints) and frequently MPS — neither is available in headless
    # Linux CI. Enable them on Apple Silicon with `-m slow`.
    "-m",
    "not slow",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external resources",
]
